<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#050505" />
  <title>Imagine Saudi 2050 — Future Vision Competition</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #f6f7fb;
      --muted: #9ba1b3;
      --dim: #646a7b;
      --line: rgba(255, 255, 255, 0.11);
      --panel: rgba(16, 18, 27, 0.72);
      --panel-strong: rgba(22, 25, 36, 0.88);
      --blue: #4285f4;
      --green: #34a853;
      --yellow: #fbbc05;
      --red: #ea4335;
      --cyan: #48e0da;
      --radius: 22px;
    }

    * { box-sizing: border-box; }
    html { min-height: 100%; background: #050505; }
    body {
      min-height: 100vh;
      margin: 0;
      overflow-x: hidden;
      color: var(--ink);
      background:
        radial-gradient(circle at 88% -10%, rgba(66, 133, 244, 0.19), transparent 28rem),
        radial-gradient(circle at 4% 55%, rgba(52, 168, 83, 0.11), transparent 25rem),
        #050505;
      font-family: "Space Grotesk", "Cairo", sans-serif;
    }

    body::before {
      position: fixed;
      z-index: -1;
      inset: 0;
      opacity: 0.22;
      pointer-events: none;
      content: "";
      background-image:
        linear-gradient(30deg, transparent 47%, rgba(255,255,255,.06) 48%, transparent 49%),
        linear-gradient(150deg, transparent 47%, rgba(255,255,255,.06) 48%, transparent 49%);
      background-size: 52px 90px;
      mask-image: linear-gradient(to bottom, #000, transparent 80%);
    }

    .page-shell {
      width: min(100% - 40px, 1720px);
      margin: 0 auto;
      padding: 28px 0 64px;
    }

    .topline {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      padding-bottom: 18px;
      border-bottom: 1px solid var(--line);
    }

    .brand-lockup, .status-lockup, .brand-copy { display: flex; align-items: center; }
    .brand-lockup { gap: 14px; }
    .brand-mark {
      display: grid;
      width: 43px;
      height: 43px;
      place-items: center;
      position: relative;
      border: 1px solid rgba(66, 133, 244, .55);
      border-radius: 13px;
      background: rgba(66, 133, 244, .11);
      box-shadow: inset 0 0 18px rgba(66, 133, 244, .14), 0 0 22px rgba(66, 133, 244, .12);
    }

    .brand-mark::after {
      width: 16px;
      height: 16px;
      border: 3px solid var(--blue);
      border-right-color: var(--yellow);
      border-bottom-color: var(--green);
      border-radius: 50%;
      content: "";
    }

    .brand-copy { gap: 12px; }
    .brand-copy::after {
      width: 1px;
      height: 27px;
      background: var(--line);
      content: "";
    }

    .eyebrow {
      margin: 0 0 2px;
      color: var(--muted);
      font-size: .66rem;
      font-weight: 700;
      letter-spacing: .16em;
      text-transform: uppercase;
    }

    .brand-name { margin: 0; font-size: .96rem; font-weight: 700; }
    .brand-name span { color: var(--blue); }
    .brand-ar { margin: 0; color: var(--muted); font-family: "Cairo", sans-serif; font-size: .92rem; }

    .status-lockup { gap: 12px; }
    .language-toggle {
      min-width: 58px;
      padding: 7px 10px;
      border: 1px solid rgba(72, 224, 218, .35);
      border-radius: 8px;
      cursor: pointer;
      background: rgba(72, 224, 218, .08);
      color: var(--cyan);
      font-family: "Cairo", sans-serif;
      font-size: .7rem;
      font-weight: 700;
      transition: background .2s ease, transform .2s ease;
    }
    .language-toggle:hover { background: rgba(72, 224, 218, .17); transform: translateY(-2px); }
    .live-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 0 5px rgba(52, 168, 83, .13), 0 0 16px var(--green);
      animation: pulse 2s infinite;
    }
    .status-text { color: var(--muted); font-size: .75rem; letter-spacing: .06em; text-transform: uppercase; }
    .fullscreen-hint {
      padding: 7px 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      color: var(--dim);
      font-size: .68rem;
      letter-spacing: .08em;
    }

    .organizer-details { margin: 18px 0 -4px; }
    .organizer-details summary {
      width: fit-content;
      padding: 7px 11px;
      border: 1px solid var(--line);
      border-radius: 9px;
      cursor: pointer;
      color: var(--dim);
      font-size: .68rem;
      letter-spacing: .06em;
      list-style: none;
      text-transform: uppercase;
      transition: color .2s ease, border-color .2s ease;
    }
    .organizer-details summary::-webkit-details-marker { display: none; }
    .organizer-details summary::before { margin-right: 7px; content: "⚙"; color: var(--cyan); }
    .organizer-details[open] summary, .organizer-details summary:hover { border-color: rgba(72, 224, 218, .45); color: var(--ink); }
    .organizer-panel {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      margin-top: 10px;
      padding: 15px;
      border: 1px solid rgba(72, 224, 218, .2);
      border-radius: 15px;
      background: rgba(16, 18, 27, .9);
    }
    .control-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      padding: 13px 15px;
      border: 1px solid var(--line);
      border-radius: 12px;
    }
    .control-card strong { display: block; font-size: .78rem; }
    .control-card small { display: block; margin-top: 4px; color: var(--dim); font-family: "Cairo", sans-serif; font-size: .68rem; }
    .toggle { position: relative; display: inline-block; flex: 0 0 auto; width: 43px; height: 24px; }
    .toggle input { width: 0; height: 0; opacity: 0; }
    .toggle-track {
      position: absolute;
      inset: 0;
      border-radius: 50px;
      cursor: pointer;
      background: #292d3a;
      transition: background .2s ease;
    }
    .toggle-track::before {
      position: absolute;
      width: 18px;
      height: 18px;
      top: 3px;
      left: 3px;
      border-radius: 50%;
      background: #8f95a5;
      content: "";
      transition: transform .2s ease, background .2s ease;
    }
    .toggle input:checked + .toggle-track { background: rgba(52, 168, 83, .45); }
    .toggle input:checked + .toggle-track::before { background: #7ee19a; transform: translateX(19px); }
    .organizer-status {
      grid-column: 1 / -1;
      margin: 0;
      color: var(--dim);
      font-family: "Cairo", sans-serif;
      font-size: .68rem;
    }

    .hero {
      position: relative;
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: end;
      gap: 34px;
      padding: clamp(42px, 7vw, 98px) 0 40px;
      animation: rise-in .9s both;
    }
    .hero::after {
      position: absolute;
      z-index: -1;
      top: 8%;
      right: 12%;
      width: 180px;
      height: 180px;
      border: 1px solid rgba(72, 224, 218, .16);
      border-radius: 50%;
      box-shadow: 0 0 0 22px rgba(72, 224, 218, .025), 0 0 0 44px rgba(72, 224, 218, .02);
      content: "";
      animation: orbit 14s linear infinite;
    }

    .hero h1 {
      max-width: 900px;
      margin: 0;
      font-size: clamp(3.3rem, 8.3vw, 9.4rem);
      font-weight: 700;
      letter-spacing: -.085em;
      line-height: .84;
    }

    .hero h1 .gradient-word {
      display: block;
      color: transparent;
      background: linear-gradient(100deg, var(--blue) 5%, #9b8eff 42%, var(--cyan) 94%);
      -webkit-background-clip: text;
      background-clip: text;
    }

    .hero-subtitle {
      max-width: 660px;
      margin: 26px 0 0;
      color: var(--muted);
      font-family: "Cairo", sans-serif;
      font-size: clamp(.9rem, 1.3vw, 1.1rem);
      line-height: 1.75;
    }

    .counter {
      position: relative;
      min-width: 258px;
      padding: 22px 24px;
      overflow: hidden;
      border: 1px solid rgba(66, 133, 244, .43);
      border-radius: var(--radius);
      background: linear-gradient(135deg, rgba(66, 133, 244, .14), rgba(52, 168, 83, .06));
      box-shadow: inset 0 0 30px rgba(66, 133, 244, .06), 0 0 32px rgba(66, 133, 244, .08);
    }

    .counter::before {
      position: absolute;
      width: 90px;
      height: 90px;
      top: -52px;
      right: -35px;
      border: 1px solid rgba(255,255,255,.18);
      border-radius: 50%;
      box-shadow: 0 0 0 10px rgba(255,255,255,.025), 0 0 0 20px rgba(255,255,255,.025);
      content: "";
    }

    .counter-label { display: block; color: var(--muted); font-size: .7rem; letter-spacing: .12em; text-transform: uppercase; }
    .counter-number {
      display: block;
      margin-top: 7px;
      color: #fff;
      font-size: 2.7rem;
      font-weight: 700;
      letter-spacing: -.06em;
      line-height: 1;
      text-shadow: 0 0 22px rgba(66, 133, 244, .75);
    }
    .counter-note { display: block; margin-top: 12px; color: var(--green); font-size: .72rem; }

    .event-flow {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin: 0 0 34px;
      animation: rise-in .9s .12s both;
    }
    .flow-step {
      position: relative;
      min-height: 138px;
      padding: 20px;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: rgba(16, 18, 27, .58);
      animation: float-card 7s ease-in-out infinite;
    }
    .flow-step:nth-child(2) { animation-delay: -2.2s; }
    .flow-step:nth-child(3) { animation-delay: -4.4s; }
    .flow-step::after {
      position: absolute;
      right: -22px;
      bottom: -33px;
      width: 90px;
      height: 90px;
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 50%;
      content: "";
    }
    .flow-number {
      display: inline-grid;
      width: 28px;
      height: 28px;
      margin-bottom: 15px;
      place-items: center;
      border-radius: 9px;
      background: rgba(66, 133, 244, .18);
      color: var(--blue);
      font-size: .75rem;
      font-weight: 700;
    }
    .flow-step:nth-child(2) .flow-number { background: rgba(251, 188, 5, .16); color: var(--yellow); }
    .flow-step:nth-child(3) .flow-number { background: rgba(52, 168, 83, .16); color: var(--green); }
    .flow-step h2 { margin: 0 0 7px; font-size: .98rem; }
    .flow-step p {
      max-width: 280px;
      margin: 0;
      color: var(--muted);
      font-family: "Cairo", sans-serif;
      font-size: .76rem;
      line-height: 1.65;
    }

    .submit-panel {
      display: grid;
      grid-template-columns: .78fr 1.22fr;
      gap: 24px;
      align-items: stretch;
      margin-bottom: 48px;
      padding: 26px;
      border: 1px solid rgba(72, 224, 218, .24);
      border-radius: var(--radius);
      background:
        radial-gradient(circle at 90% 0%, rgba(72, 224, 218, .12), transparent 22rem),
        var(--panel);
      animation: rise-in .9s .22s both;
    }
    .submit-intro { display: flex; flex-direction: column; justify-content: center; }
    .submit-kicker { margin: 0 0 9px; color: var(--cyan); font-size: .68rem; font-weight: 700; letter-spacing: .15em; text-transform: uppercase; }
    .submit-intro h2 { max-width: 400px; margin: 0; font-size: clamp(1.5rem, 3vw, 2.5rem); letter-spacing: -.05em; line-height: 1; }
    .submit-intro p { max-width: 430px; margin: 15px 0 0; color: var(--muted); font-family: "Cairo", sans-serif; font-size: .87rem; line-height: 1.8; }
    .vision-form { display: grid; grid-template-columns: 1fr 1fr; gap: 13px; }
    .field { display: flex; flex-direction: column; gap: 7px; }
    .field.full { grid-column: 1 / -1; }
    .field label { color: var(--muted); font-family: "Cairo", sans-serif; font-size: .73rem; }
    .field input, .field select, .field textarea {
      width: 100%;
      border: 1px solid rgba(255,255,255,.13);
      border-radius: 11px;
      outline: none;
      background: rgba(4, 5, 10, .64);
      color: var(--ink);
      font: inherit;
      font-size: .8rem;
      transition: border-color .2s ease, box-shadow .2s ease;
    }
    .field input, .field select { height: 42px; padding: 0 12px; }
    .field textarea { min-height: 92px; padding: 11px 12px; resize: vertical; }
    .field input:focus, .field select:focus, .field textarea:focus {
      border-color: var(--cyan);
      box-shadow: 0 0 0 3px rgba(72, 224, 218, .1);
    }
    .field select option { background: #11131b; }
    .submit-actions { display: flex; align-items: center; justify-content: space-between; gap: 12px; grid-column: 1 / -1; }
    .form-note { color: var(--dim); font-family: "Cairo", sans-serif; font-size: .68rem; }
    .generate-button, .vote-button {
      border: 0;
      border-radius: 10px;
      cursor: pointer;
      font: inherit;
      font-weight: 700;
      transition: transform .2s ease, box-shadow .2s ease, opacity .2s ease;
    }
    .generate-button {
      padding: 12px 17px;
      background: linear-gradient(100deg, var(--blue), var(--cyan));
      color: #041012;
      font-size: .76rem;
    }
    .generate-button:hover, .vote-button:hover:not(:disabled) { box-shadow: 0 7px 20px rgba(72, 224, 218, .2); transform: translateY(-2px); }
    .generate-button:disabled { cursor: wait; opacity: .65; }
    .vote-row { display: flex; align-items: center; justify-content: flex-end; gap: 9px; margin-top: 17px; }
    .vote-button { padding: 8px 11px; background: rgba(66, 133, 244, .13); color: #9ac0ff; font-size: .7rem; }
    .vote-button.voted { background: rgba(52, 168, 83, .16); color: #7ee19a; }
    .vote-button:disabled { cursor: default; }
    .vote-count { color: var(--dim); font-size: .69rem; }
    .closed-message {
      display: none;
      margin: 11px 0 0;
      color: var(--yellow);
      font-family: "Cairo", sans-serif;
      font-size: .72rem;
    }
    .is-closed .closed-message { display: block; }
    .is-closed .vision-form { opacity: .52; }

    .gallery-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 20px;
    }
    .section-title { margin: 0; font-size: 1rem; font-weight: 600; }
    .section-title span { color: var(--dim); font-weight: 400; }
    .sync-state { display: flex; align-items: center; gap: 8px; color: var(--dim); font-size: .72rem; }
    .sync-icon { color: var(--cyan); animation: spin 3s linear infinite; }

    .gallery-grid {
      column-count: 4;
      column-gap: 18px;
    }

    .vision-card {
      display: inline-block;
      width: 100%;
      margin: 0 0 18px;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--panel);
      break-inside: avoid;
      box-shadow: 0 12px 40px rgba(0,0,0,.18);
      transition: transform .35s ease, border-color .35s ease, box-shadow .35s ease;
      animation: card-in .7s both;
    }
    .vision-card:hover {
      z-index: 2;
      border-color: rgba(72, 224, 218, .5);
      box-shadow: 0 18px 55px rgba(0,0,0,.38), 0 0 24px rgba(72, 224, 218, .09);
      transform: translateY(-7px);
    }
    .vision-card:nth-child(3n) { animation-duration: .95s; }
    .vision-card:nth-child(3n + 1) { animation-duration: .72s; }

    .vision-image-wrap { position: relative; overflow: hidden; background: #131722; }
    .vision-image {
      display: block;
      width: 100%;
      min-height: 180px;
      object-fit: cover;
      transition: transform .7s cubic-bezier(.2,.8,.2,1), filter .35s ease;
    }
    .vision-card:hover .vision-image { filter: saturate(1.18); transform: scale(1.045); }
    .image-glow {
      position: absolute;
      inset: auto 0 0;
      height: 45%;
      pointer-events: none;
      background: linear-gradient(transparent, rgba(5,5,5,.78));
    }
    .card-index {
      position: absolute;
      top: 14px;
      left: 14px;
      padding: 5px 8px;
      border: 1px solid rgba(255,255,255,.17);
      border-radius: 7px;
      background: rgba(5,5,5,.5);
      color: rgba(255,255,255,.72);
      backdrop-filter: blur(8px);
      font-size: .65rem;
    }

    .vision-content { padding: 17px 18px 20px; }
    .card-meta { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .team-name { margin: 0; font-size: 1rem; font-weight: 700; }
    .track-badge {
      padding: 5px 8px;
      border: 1px solid currentColor;
      border-radius: 99px;
      font-size: .61rem;
      font-weight: 700;
      letter-spacing: .06em;
      white-space: nowrap;
    }
    .prompt {
      margin: 14px 0 0;
      color: var(--muted);
      font-family: "Cairo", sans-serif;
      font-size: .84rem;
      line-height: 1.7;
    }
    .prompt::before { margin-right: 6px; color: var(--cyan); content: "↳"; font-family: sans-serif; }

    .footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      margin-top: 34px;
      padding-top: 18px;
      border-top: 1px solid var(--line);
      color: var(--dim);
      font-size: .7rem;
    }
    .footer strong { color: var(--muted); font-weight: 500; }
    .color-dashes { display: flex; gap: 4px; }
    .color-dashes i { display: block; width: 19px; height: 3px; border-radius: 4px; }
    .color-dashes i:nth-child(1) { background: var(--blue); }
    .color-dashes i:nth-child(2) { background: var(--red); }
    .color-dashes i:nth-child(3) { background: var(--yellow); }
    .color-dashes i:nth-child(4) { background: var(--green); }

    @keyframes pulse { 50% { opacity: .45; transform: scale(.78); } }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes card-in { from { opacity: 0; transform: translateY(14px) scale(.98); } to { opacity: 1; transform: translateY(0) scale(1); } }
    @keyframes rise-in { from { opacity: 0; transform: translateY(22px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes float-card { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
    @keyframes orbit { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
    }

    @media (max-width: 1180px) { .gallery-grid { column-count: 3; } }
    @media (max-width: 800px) {
      .page-shell { width: min(100% - 28px, 620px); padding-top: 18px; }
      .topline { align-items: flex-start; }
      .status-lockup { flex-wrap: wrap; justify-content: flex-end; }
      .fullscreen-hint { display: none; }
      .hero { display: block; padding: 64px 0 34px; }
      .counter { min-width: 0; margin-top: 28px; }
      .event-flow { grid-template-columns: 1fr; }
      .submit-panel { grid-template-columns: 1fr; padding: 21px; }
      .gallery-grid { column-count: 2; }
    }
    @media (max-width: 520px) {
      .brand-copy::after, .brand-ar { display: none; }
      .brand-copy { gap: 0; }
      .brand-name { font-size: .82rem; }
      .status-text { font-size: .64rem; }
      .organizer-panel { grid-template-columns: 1fr; }
      .organizer-status { grid-column: auto; }
      .hero h1 { font-size: clamp(3rem, 17vw, 5.5rem); }
      .vision-form { grid-template-columns: 1fr; }
      .field.full, .submit-actions { grid-column: auto; }
      .submit-actions { align-items: flex-start; flex-direction: column; }
      .gallery-grid { column-count: 1; }
      .gallery-toolbar { align-items: flex-start; flex-direction: column; gap: 10px; }
      .footer { align-items: flex-start; flex-direction: column; }
    }
  </style>
</head>
<body>
  <main class="page-shell">
    <header class="top
